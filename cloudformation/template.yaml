AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create an SNS topic (Standard or FIFO) with optional KMS encryption and an optional cross-account resource policy'

Parameters:
  ProjectName:
    Type: String
    Default: 'proj-ztc'
    Description: Project name to use as a topic name prefix
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Project name must be lowercase letters, numbers, and hyphens only

  SnsTopicBaseName:
    Type: String
    Default: 'sns-topic'
    Description: Base name for the SNS topic (project, environment, and region are prefixed/appended)
    MinLength: 1
    MaxLength: 60
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    ConstraintDescription: Base name must contain only letters, numbers, hyphens, and underscores

  Environment:
    Type: String
    Default: 'devl'
    Description: Deployment environment for the SNS topic
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Environment must be lowercase letters, numbers, and hyphens only

  TopicType:
    Type: String
    Default: Standard
    AllowedValues: [Standard, FIFO]
    Description: Type of SNS topic to create. FIFO topics get the .fifo suffix appended to the name

  ContentBasedDeduplication:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable content-based deduplication (only applies when TopicType is FIFO)

  KmsKeyId:
    Type: String
    Default: ''
    AllowedPattern: "^(alias/[a-zA-Z0-9/_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/[a-zA-Z0-9/_-]+|[a-f0-9-]{36}|mrk-[a-f0-9]{32})?$"
    ConstraintDescription: "KMS key must be an alias (alias/my-key), a key ARN (arn:aws:kms:region:account:key/key-id), a key ID, or left empty for no encryption"
    Description: "Optional KMS key to encrypt the topic. Accepts alias (alias/my-key), key ARN, or key ID. Leave empty for no SSE. The key policy must also allow cross-account principals to use the key."

  CrossAccountIds:
    Type: String
    Default: ''
    AllowedPattern: "^(\\d{12}(,\\d{12})*)?$"
    ConstraintDescription: Provide a comma-separated list of 12-digit AWS account IDs, or leave empty
    Description: Optional comma-separated AWS account IDs granted access to the topic (e.g. 111122223333,444455556666). Leave empty to skip the topic policy.

  CrossAccountActions:
    Type: String
    Default: 'sns:Publish'
    AllowedValues: ['sns:Publish', 'sns:Subscribe', 'sns:Publish,sns:Subscribe']
    Description: SNS actions granted to the CrossAccountIds accounts (only used if CrossAccountIds is set)

  CiSuffix:
    Type: String
    Default: ''
    Description: Optional CI suffix to append to the topic name
    MaxLength: 30
    AllowedPattern: "^[a-zA-Z0-9_-]*$"
    ConstraintDescription: CI suffix must contain only letters, numbers, hyphens, and underscores
    
Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, '']]
  IsFifo: !Equals [!Ref TopicType, FIFO]
  EnableContentDedup: !Equals [!Ref ContentBasedDeduplication, 'true']
  IsFifoWithDedup: !And
    - !Condition IsFifo
    - !Condition EnableContentDedup
  HasKmsKey: !Not [!Equals [!Ref KmsKeyId, '']]
  HasCrossAccountIds: !Not [!Equals [!Ref CrossAccountIds, '']]

Resources:
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      # <ProjectName>-<SnsTopicBaseName>-<Environment>-<Region>[-<CiSuffix>][.fifo]
      TopicName: !Join
        - ''
        - - !Sub '${ProjectName}-${SnsTopicBaseName}-${Environment}-${AWS::Region}'
          - !If [HasCiSuffix, !Sub '-${CiSuffix}', '']
          - !If [IsFifo, '.fifo', '']
      FifoTopic: !If [IsFifo, true, !Ref AWS::NoValue]
      ContentBasedDeduplication: !If [IsFifoWithDedup, true, !Ref AWS::NoValue]
      KmsMasterKeyId: !If [HasKmsKey, !Ref KmsKeyId, !Ref AWS::NoValue]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  SnsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasCrossAccountIds
    Properties:
      Topics:
        - !Ref SnsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CrossAccountAccess
            Effect: Allow
            Principal:
              AWS: !Split [',', !Ref CrossAccountIds]
            Action: !Split [',', !Ref CrossAccountActions]
            Resource: !Ref SnsTopic

Outputs:
  TopicArn:
    Description: ARN of the SNS topic
    Value: !Ref SnsTopic

  TopicName:
    Description: Name of the SNS topic
    Value: !GetAtt SnsTopic.TopicName

  CrossAccountPolicyApplied:
    Description: Whether a cross-account topic policy was created
    Value: !If [HasCrossAccountIds, 'true', 'false']
