AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create a DynamoDB table with flexible configuration for streams, LSI, and GSI'

Parameters:
  ProjectName:
    Type: String
    Default: 'proj-ztc'
    Description: Project name to use as a table prefix
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Project name must be lowercase letters, numbers, and hyphens only

  TableBaseName:
    Type: String
    Default: 'dynamodb-table'
    Description: Base name for the DynamoDB table (account ID, environment, and region will be appended)

  Environment:
    Type: String
    Default: 'devl'
    Description: Deployment environment for the DynamoDB table

  CiSuffix:
    Type: String
    Default: ''
    Description: Optional CI suffix to append to the table name

  KmsKey:
    Type: String
    Default: 'SB-KMS'
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9_-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name (e.g., my-key, auto-converted to alias/my-key), a KMS key alias (e.g., alias/my-key), or a full KMS key ARN (e.g., arn:aws:kms:region:account:key/key-id), or leave empty for no KMS encryption"
    Description: "Optional KMS Key for DynamoDB table encryption. Accepts: key name (my-key), alias (alias/my-key), or ARN (arn:aws:kms:region:account:key/key-id). Plain key names are auto-converted to aliases."

  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: Billing mode for the DynamoDB table

  ProvisionedReadCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: Read capacity units (only used if BillingMode is PROVISIONED)

  ProvisionedWriteCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: Write capacity units (only used if BillingMode is PROVISIONED)

  PartitionKeyName:
    Type: String
    Default: PK
    Description: Name of the partition key attribute
    MinLength: 1
    MaxLength: 255

  PartitionKeyType:
    Type: String
    Default: S
    AllowedValues: [S, N, B]
    Description: Data type for partition key (S=String, N=Number, B=Binary)

  SortKeyName:
    Type: String
    Default: SK
    Description: Name of the sort key attribute (leave empty if not needed)
    MaxLength: 255

  SortKeyType:
    Type: String
    Default: S
    AllowedValues: [S, N, B]
    Description: Data type for sort key (S=String, N=Number, B=Binary)

  EnableStreams:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable DynamoDB Streams

  StreamViewType:
    Type: String
    Default: NEW_AND_OLD_IMAGES
    AllowedValues: [KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES]
    Description: What information is written to the stream when an item in the table is modified

  EnablePointInTimeRecovery:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable point-in-time recovery

  EnableTTL:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable TTL on the table

  TTLAttributeName:
    Type: String
    Default: ExpirationTime
    Description: Name of the attribute to use for TTL
    MaxLength: 255

  LSI1Enabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable Local Secondary Index 1 (requires sort key on base table)

  LSI1AttributeName:
    Type: String
    Default: LSI1SK
    Description: Sort key attribute name for LSI1
    MaxLength: 255

  LSI1AttributeType:
    Type: String
    Default: S
    AllowedValues: [S, N, B]
    Description: Data type for LSI1 sort key

  GSI1Enabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable Global Secondary Index 1

  GSI1PartitionKeyName:
    Type: String
    Default: GSI1PK
    Description: Partition key attribute name for GSI1
    MaxLength: 255

  GSI1PartitionKeyType:
    Type: String
    Default: S
    AllowedValues: [S, N, B]
    Description: Data type for GSI1 partition key

  GSI1SortKeyName:
    Type: String
    Default: ''
    Description: Optional sort key attribute name for GSI1
    MaxLength: 255

  GSI1SortKeyType:
    Type: String
    Default: S
    AllowedValues: [S, N, B]
    Description: Data type for GSI1 sort key (if used)

  GSI1ReadCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: Read capacity for GSI1 (only used if BillingMode is PROVISIONED)

  GSI1WriteCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: Write capacity for GSI1 (only used if BillingMode is PROVISIONED)

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  HasCustomKmsKey: !Not [!Equals [!Ref KmsKey, ""]]
  IsKmsKeyArn: !Equals [!Select [0, !Split [':', !Ref KmsKey]], 'arn']
  IsKmsKeyAlias: !Equals [!Select [0, !Split ['/', !Ref KmsKey]], 'alias']
  IsProvisioned: !Equals [!Ref BillingMode, PROVISIONED]
  HasSortKey: !Not [!Equals [!Ref SortKeyName, '']]
  EnableStreamConfig: !Equals [!Ref EnableStreams, 'true']
  EnableTTLConfig: !Equals [!Ref EnableTTL, 'true']
  EnablePITRConfig: !Equals [!Ref EnablePointInTimeRecovery, 'true']
  EnableLSI1: !Equals [!Ref LSI1Enabled, 'true']
  EnableGSI1: !Equals [!Ref GSI1Enabled, 'true']
  GSI1HasSortKey: !Not [!Equals [!Ref GSI1SortKeyName, '']]
  GSI1WithSortKey: !And
    - !Condition EnableGSI1
    - !Condition GSI1HasSortKey
  LSI1WithSortKey: !And
    - !Condition HasSortKey
    - !Condition EnableLSI1

Resources:
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !If
        - HasCiSuffix
        - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
        - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}'
      BillingMode: !Ref BillingMode
      ProvisionedThroughput: !If
        - IsProvisioned
        - ReadCapacityUnits: !Ref ProvisionedReadCapacity
          WriteCapacityUnits: !Ref ProvisionedWriteCapacity
        - !Ref AWS::NoValue
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
        - !If
          - HasSortKey
          - AttributeName: !Ref SortKeyName
            AttributeType: !Ref SortKeyType
          - !Ref AWS::NoValue
        - !If
          - EnableLSI1
          - AttributeName: !Ref LSI1AttributeName
            AttributeType: !Ref LSI1AttributeType
          - !Ref AWS::NoValue
        - !If
          - EnableGSI1
          - AttributeName: !Ref GSI1PartitionKeyName
            AttributeType: !Ref GSI1PartitionKeyType
          - !Ref AWS::NoValue
        - !If
          - GSI1WithSortKey
          - AttributeName: !Ref GSI1SortKeyName
            AttributeType: !Ref GSI1SortKeyType
          - !Ref AWS::NoValue
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
        - !If
          - HasSortKey
          - AttributeName: !Ref SortKeyName
            KeyType: RANGE
          - !Ref AWS::NoValue
      LocalSecondaryIndexes: !If
        - LSI1WithSortKey
        - - IndexName: !If
              - HasCiSuffix
              - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}-LSI1'
              - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-LSI1'
            KeySchema:
              - AttributeName: !Ref PartitionKeyName
                KeyType: HASH
              - AttributeName: !Ref LSI1AttributeName
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        - !Ref AWS::NoValue
      GlobalSecondaryIndexes: !If
        - EnableGSI1
        - - IndexName: !If
              - HasCiSuffix
              - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}-GSI1'
              - !Sub '${ProjectName}-${TableBaseName}-${AWS::AccountId}-${Environment}-${AWS::Region}-GSI1'
            KeySchema:
              - AttributeName: !Ref GSI1PartitionKeyName
                KeyType: HASH
              - !If
                - GSI1WithSortKey
                - AttributeName: !Ref GSI1SortKeyName
                  KeyType: RANGE
                - !Ref AWS::NoValue
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput: !If
              - IsProvisioned
              - ReadCapacityUnits: !Ref GSI1ReadCapacity
                WriteCapacityUnits: !Ref GSI1WriteCapacity
              - !Ref AWS::NoValue
        - !Ref AWS::NoValue
      StreamSpecification: !If
        - EnableStreamConfig
        - StreamViewType: !Ref StreamViewType
        - !Ref AWS::NoValue
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EnablePITRConfig, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !If
          - HasCustomKmsKey
          - !If
            - IsKmsKeyArn
            - !Ref KmsKey
            - !If
              - IsKmsKeyAlias
              - !Ref KmsKey
              - !Sub 'alias/${KmsKey}'
          - alias/aws/dynamodb
      TimeToLiveSpecification: !If
        - EnableTTLConfig
        - AttributeName: !Ref TTLAttributeName
          Enabled: true
        - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt DynamoDBTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  StreamArn:
    Description: ARN of the DynamoDB Stream
    Value: !GetAtt DynamoDBTable.StreamArn
    Condition: EnableStreamConfig
    Export:
      Name: !Sub "${AWS::StackName}-StreamArn"